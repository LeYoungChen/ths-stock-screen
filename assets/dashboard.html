<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>选股条件检验</title><link rel="icon" href="data:,">
<style>
:root{--ink:#16332e;--muted:#637973;--green:#137a63;--red:#bd5346;--bg:#f3f6f3;--line:#dce5df}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}main{max-width:1500px;margin:36px auto;padding:0 28px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:32px;margin:2px 0 8px;letter-spacing:-1px}h2{font-size:18px;margin:0 0 12px}p{margin:4px 0 12px}.eyebrow{color:var(--green);font-size:11px;letter-spacing:2px}.muted{color:var(--muted)}.badge{border:1px solid var(--line);padding:6px 13px;border-radius:20px;background:white}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:22px 0}.stat,.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px}.stat strong{font-size:32px;display:block;font-weight:600}.stat small{color:var(--muted)}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0}button,select,input{font:inherit;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink);padding:7px 12px}button{cursor:pointer}button:hover,button.active{border-color:var(--green);background:#e9f4ee}.legend{margin-left:auto;font-size:12px;display:flex;gap:12px}.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px}.pass{background:#ccecdf;color:#126b53}.fail{background:#f7dcd6;color:#a34136}.unknown{background:#e9edf0;color:#7a858a}.tablewrap{overflow:auto;max-height:560px;border:1px solid var(--line);border-radius:8px}table{border-collapse:separate;border-spacing:0;width:100%;font-size:12px}th,td{padding:6px 4px;text-align:center;border-bottom:1px solid #edf1ed;white-space:nowrap}thead{position:sticky;top:0;z-index:3;background:#f5f8f5}th{font-weight:500}td.cell{min-width:28px;padding:3px}td.cell button{width:25px;height:25px;padding:0;border:0;border-radius:4px;font-size:12px}.stock{min-width:158px;text-align:left;position:sticky;left:0;background:white;z-index:1;padding-left:12px}thead .stock{background:#f5f8f5;z-index:4}.score{min-width:74px}.stock button{border:0;padding:0;text-align:left;background:none}.stock small{color:var(--muted);font-size:10px;display:block}tr.selected .stock{box-shadow:inset 3px 0 var(--green);background:#edf6f0}.lower{display:grid;grid-template-columns:310px 1fr;gap:16px;margin:18px 0}.candidate{display:block;width:100%;text-align:left;margin:7px 0;padding:10px}.candidate small{display:block;color:var(--muted)}.perf{display:flex;gap:26px;margin:8px 0 16px}.perf strong{display:block;font-size:20px}.perf small{color:var(--muted)}svg{width:100%;height:auto;display:block}.details{border-top:1px solid var(--line);margin-top:14px;padding-top:12px}.details pre{white-space:pre-wrap;word-break:break-word;font-size:12px;max-height:240px;overflow:auto}.chip{display:inline-block;padding:2px 8px;border-radius:4px;font-size:12px;margin:3px}details{margin:16px 0}summary{cursor:pointer;color:var(--muted)}.notice{font-size:12px;background:#f4f6f3;padding:10px 14px;border-radius:8px}.topline{display:flex;justify-content:space-between;gap:10px}.empty{padding:20px;color:var(--muted)}@media(max-width:850px){main{padding:0 12px;margin:18px auto}.lower{grid-template-columns:1fr}.stats{gap:6px}.stat{padding:10px}.stat strong{font-size:24px}.legend{margin-left:0}h1{font-size:25px}header{align-items:flex-start}.panel{padding:14px}}
.flow{margin:20px 0}.breadcrumbs{display:flex;align-items:stretch;gap:8px;overflow-x:auto;padding:8px 0 12px}.crumb{min-width:132px;padding:12px;background:#f3f7f4;border:1px solid var(--line);border-radius:9px}.crumb strong{display:block;font-size:23px}.crumb small{display:block;color:var(--muted);font-size:11px}.arrow{align-self:center;color:#91a69b}.flow table th,.flow table td{text-align:left;padding:7px 12px}.flow details{margin-bottom:0}.flow .summaryline{font-size:16px;margin:8px 0}.flow .summaryline b{color:var(--green)}
</style>
<main><header><div><div class="eyebrow">STOCK SCREEN / 33 RULES</div><h1>每只股票，逐条检验</h1><p id="subtitle" class="muted"></p></div><span class="badge">收盘后 · 固定规则</span></header><section class="panel flow" aria-label="筛选流程"><h2 id="flow-title">筛选流程</h2><p id="flow-scope" class="muted"></p><div id="upstream"></div><nav class="breadcrumbs" id="breadcrumbs" aria-label="各组筛选数量"></nav><p id="flow-end" class="summaryline"></p><details><summary>展开全部 33 步的剔除明细</summary><p class="muted" id="flow-note"></p><div class="tablewrap" id="flow-steps"></div></details></section><div class="stats" id="stats"></div>
<section class="panel"><div class="topline"><h2>条件热力图</h2><span class="muted">点击股票看走势 · 点击色块看依据</span></div><div class="toolbar"><select id="filter" aria-label="名单筛选"><option value="all">全部候选</option><option value="pass">全部通过</option><option value="pending">无失败，仍待核验</option><option value="fail">已有条件不通过</option></select><input id="search" aria-label="搜索股票" placeholder="搜索名称 / 代码"><button id="download">导出当前名单 CSV</button><div class="legend"><span><i class="dot pass"></i>通过 ✓</span><span><i class="dot fail"></i>不通过 ×</span><span><i class="dot unknown"></i>待核验 ?</span></div></div><div id="heatmap" class="tablewrap"></div><p class="muted" style="font-size:12px;margin-top:10px">按通过数降序、失败数升序排列；分母固定为 33。待核验不计入通过；有一项不通过即未满足完整策略。</p></section>
<div class="lower"><aside class="panel"><h2>匹配度较高的候选</h2><p class="muted" style="font-size:12px">展示前 5 只，排序不代表收益预测。</p><div id="leaders"></div><div class="notice" id="empty-pass"></div></aside><section class="panel"><div class="topline"><h2 id="chart-title"></h2><span class="muted" id="chart-type"></span></div><div class="perf" id="perf"></div><div id="chart"></div><div id="chart-note" class="muted" style="font-size:12px"></div><div class="details" id="stock-details"></div><details id="evidence"><summary>单项检验依据</summary><div id="evidence-body"></div></details></section></div>
<details class="panel"><summary>数据范围与准确性说明</summary><div id="audit"></div></details><p class="muted" style="font-size:12px">规则检验与历史表现，不是买入建议。完整结果及逐条数值见同目录 results.json / conditions.csv。</p></main>
<script id="data" type="application/json">__SCREEN_DATA__</script><script>
'use strict';const D=JSON.parse(document.getElementById('data').textContent),$=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),symbols={pass:'✓',fail:'×',unknown:'?'},names={pass:'通过',fail:'不通过',unknown:'待核验'};let selected=D.stocks[0]?.code;
$('subtitle').textContent=`${D.as_of} · ${D.totals.pool} 只候选 · ${D.market_complete?'已验证覆盖范围':'仅当前候选池，不能推断全市场结果'}`;
$('stats').innerHTML=[['候选池',D.totals.pool,'原始候选全部保留'],['全部通过',D.totals.pass,'33 / 33 条已证实'],['无失败，仍待核验',D.totals.pending,'缺数据或口径未确认'],['已有条件不通过',D.totals.fail,'仍可查看部分通过项']].map(x=>`<div class="stat">${x[0]}<strong>${x[1]}</strong><small>${x[2]}</small></div>`).join('');
const F=D.funnel;
if(F){
$('flow-title').textContent=`本次对 ${F.start} 只股票进行了 33 条条件检验`;
$('flow-scope').textContent=D.market_complete?'本次覆盖已核实的完整股票范围。':F.upstream.length?'以下预筛数量来自连续名单记录；不代表已证明全市场覆盖。':'全市场 → 历史预筛：起始数量及逐步剔除数未核实。本次可追溯流程从当前候选池开始。';
const crumb=(label,n,small)=>`<div class="crumb"><span>${esc(label)}</span><strong>${n} <small style="display:inline">只</small></strong><small>${esc(small)}</small></div>`;
$('upstream').innerHTML=F.upstream.length?'<details><summary>查看进入候选池前的预筛记录</summary>'+F.upstream.map(s=>`<p>${esc(s.label)}：${s.entered} → 移出 ${s.removed} → 剩余 ${s.remaining} 只 <small class="muted">来源：${esc(s.source)}</small></p>`).join('')+'</details>':'';
$('breadcrumbs').innerHTML=[crumb('起始候选池',F.start,'待逐项检验'),...F.groups.map(g=>crumb(g.label,g.remaining,`本步剔除 ${g.removed} · 累计待核验 ${g.pending}`))].join('<span class="arrow" aria-hidden="true">›</span>');
$('flow-end').innerHTML=`累计剔除 <b>${F.start-F.remaining}</b> 只，剩余 <b>${F.remaining}</b> 只：其中 <b>${F.passed}</b> 只全部通过，<b>${F.pending}</b> 只仍待核验。`;
$('flow-note').textContent=F.note+' 各步“待核验”指剩余股票中截至该步存在未知条件的数量。';
$('flow-steps').innerHTML='<table><thead><tr><th>条件</th><th>进入</th><th>本步剔除</th><th>剩余</th><th>累计待核验</th></tr></thead><tbody>'+F.steps.map(s=>`<tr><td>${s.rule}. ${esc(s.label)}</td><td>${s.entered}</td><td title="${esc(s.removed_codes.join('、'))}">${s.removed}</td><td>${s.remaining}</td><td>${s.pending}</td></tr>`).join('')+'</tbody></table>';
}else{$('flow-scope').textContent='此结果文件尚无筛选流程，请用新版校验器重新生成。'}
function visible(){return D.stocks.filter(s=>($('filter').value==='all'||s.verdict===$('filter').value)&&(`${s.code} ${s.name}`).toLowerCase().includes($('search').value.toLowerCase()))}
function table(){const rows=visible();$('heatmap').innerHTML=`<table><thead><tr><th class="stock" rowspan="2">股票 / 代码</th><th rowspan="2" class="score">通过 / 33</th>${D.groups.map(g=>`<th colspan="${g[2]-g[1]+1}">${esc(g[0])}</th>`).join('')}</tr><tr>${D.labels.map((l,i)=>`<th title="${esc(l)}">${i+1}</th>`).join('')}</tr></thead><tbody>${rows.map(s=>`<tr class="${s.code===selected?'selected':''}"><td class="stock"><button data-code="${esc(s.code)}">${esc(s.name)}<small>${esc(s.code)}</small></button></td><td class="score"><b>${s.passed}</b> / 33</td>${Object.entries(s.conditions).map(([i,c])=>`<td class="cell"><button class="${c.status}" data-code="${esc(s.code)}" data-rule="${i}" title="${esc(i+'. '+c.label+'：'+names[c.status])}" aria-label="${esc(s.name+' '+c.label+' '+names[c.status])}">${symbols[c.status]}</button></td>`).join('')}</tr>`).join('')}</tbody></table>${rows.length?'':'<div class="empty">当前筛选下没有股票。</div>'}`;}
function fmt(n){return n==null?'—':(n>=0?'+':'')+n.toFixed(2)+'%'}
function chart(s){const bars=s.chart.bars;$('chart-title').textContent=s.name+' · '+s.code;$('chart-type').textContent=s.chart.kind==='candlestick'?'近期日 K 线':'近期收盘走势';$('perf').innerHTML=[5,20,60].map(n=>`<div><small>${n} 个交易日收盘变化</small><strong>${fmt(s.chart.changes[String(n)])}</strong></div>`).join('');$('chart-note').textContent=s.chart.basis+'；'+(s.chart.kind==='close'?'缺少开高低数据，未绘制蜡烛K线。':'使用完整开高低收数据。');if(!bars.length){$('chart').textContent='暂无可绘制数据';return}
const W=860,H=275,L=52,R=16,top=14,bottom=194,lo=Math.min(...bars.map(b=>b.low??b.close)),hi=Math.max(...bars.map(b=>b.high??b.close)),pad=(hi-lo)*.12||1,min=lo-pad,max=hi+pad,x=i=>L+i*(W-L-R)/Math.max(1,bars.length-1),y=v=>bottom-(v-min)/(max-min)*(bottom-top),vmax=Math.max(...bars.map(b=>b.volume),1);let svg='';for(let i=0;i<4;i++){let p=min+(max-min)*i/3,yy=y(p);svg+=`<line x1="${L}" y1="${yy}" x2="${W-R}" y2="${yy}" stroke="#e9efea"/><text x="3" y="${yy+4}" fill="#637973" font-size="11">${p.toFixed(2)}</text>`}
if(s.chart.kind==='candlestick'){bars.forEach((b,i)=>{const color=b.close>=b.open?'#bd5346':'#137a63',bw=Math.max(2,(W-L-R)/bars.length*.55);svg+=`<line x1="${x(i)}" y1="${y(b.high)}" x2="${x(i)}" y2="${y(b.low)}" stroke="${color}"/><rect x="${x(i)-bw/2}" y="${Math.min(y(b.open),y(b.close))}" width="${bw}" height="${Math.max(1,Math.abs(y(b.open)-y(b.close)))}" fill="${color}"/>`})}else{svg+=`<polyline points="${bars.map((b,i)=>x(i)+','+y(b.close)).join(' ')}" fill="none" stroke="#137a63" stroke-width="2.3"/>`}
bars.forEach((b,i)=>{svg+=`<rect x="${x(i)-3}" y="${248-b.volume/vmax*36}" width="6" height="${b.volume/vmax*36}" fill="#bfd4c8"><title>${esc(b.date)} 收盘 ${b.close} 成交量 ${b.volume}</title></rect>`});svg+=`<text x="2" y="231" font-size="10" fill="#637973">成交量</text><text x="${L}" y="270" font-size="11" fill="#637973">${bars[0].date}</text><text x="${W-R}" y="270" text-anchor="end" font-size="11" fill="#637973">${bars.at(-1).date}</text>`;$('chart').innerHTML=`<svg role="img" aria-label="${esc(s.name)}近期价格及成交量" viewBox="0 0 ${W} ${H}">${svg}</svg>`;}
function select(code,rule){selected=code;const s=D.stocks.find(s=>s.code===code);if(!s)return;table();chart(s);$('stock-details').innerHTML=`<b>${s.passed} 项通过 · ${s.failed} 项不通过 · ${s.unknown} 项待核验</b>`+['fail','unknown'].map(st=>`<div style="margin-top:8px">${names[st]}：${Object.entries(s.conditions).filter(([,c])=>c.status===st).map(([i,c])=>`<button class="chip ${st}" data-code="${esc(code)}" data-rule="${i}">${i}. ${esc(c.label)}</button>`).join('')||'无'}</div>`).join('');if(rule){const c=s.conditions[rule];$('evidence').open=true;$('evidence-body').innerHTML=`<b>${rule}. ${esc(c.label)} · ${names[c.status]}</b><p>${esc(c.reason)}</p><pre>${esc(JSON.stringify(c.values,null,2))}</pre><small>来源：${esc(c.sources.join('；'))}<br>口径：${esc(JSON.stringify(c.definitions))}</small>`}else{$('evidence').open=false;$('evidence-body').textContent='点击热力图色块查看。'}}
$('leaders').innerHTML=D.stocks.slice(0,5).map((s,i)=>`<button class="candidate" data-code="${esc(s.code)}">${i+1}. ${esc(s.name)} <b>${s.passed} / 33</b><small>${s.failed} 项不通过 · ${s.unknown} 项待核验 · 20日 ${fmt(s.chart.changes['20'])}</small></button>`).join('');$('empty-pass').textContent=D.totals.pass?'全部通过名单可在上方筛选和导出。':'当前没有已证实全部通过的股票。待核验候选仍需补齐证据。';
$('audit').innerHTML=`<p>${esc(D.scope.note||'')}</p><p>${esc(D.calendar_source)}</p><p>MACD 跨通道有效比较 ${D.audit.macd_comparisons??'—'} 次，差异 ${D.audit.macd_mismatch_count??'—'} 次。</p><ul>${(D.audit.notes||[]).map(n=>'<li>'+esc(n)+'</li>').join('')}</ul><p>引擎 ${esc(D.version)} · 每项实际数值、来源与定义均保存在结果文件中。</p>`;
document.addEventListener('click',e=>{const b=e.target.closest('[data-code]');if(b)select(b.dataset.code,b.dataset.rule)});$('filter').onchange=table;$('search').oninput=table;$('download').onclick=()=>{const cells=x=>'"'+String(x??'').replace(/"/g,'""')+'"',rows=[['代码','名称','通过','不通过','待核验','5日收盘变化%','20日收盘变化%'],...visible().map(s=>[s.code,s.name,s.passed,s.failed,s.unknown,s.chart.changes['5'],s.chart.changes['20']])],url=URL.createObjectURL(new Blob(['\ufeff'+rows.map(r=>r.map(cells).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='候选名单-'+D.as_of+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};if(selected)select(selected);else table();
</script></html>
